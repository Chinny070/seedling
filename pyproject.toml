[project]
name = "seedling"
version = "0.1.0"
description = "Reusable GenLayer-native latent-public-goods discovery, lineage-attribution, and progressive retroactive-funding primitive"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "direct: in-process GenVM execution (no simulator/node required)",
    "integration: runs against a GenLayer Studio/simulator endpoint",
]
